{% extends "base.html" %}

{% block title %}{{ "正确！" if correct else "错误！" }} - 英语背单词挑战{% endblock %}

{% block content %}
<div class="text-center">
    {% if correct %}
        <div class="alert alert-success">
            <h4 class="alert-heading">✅ 正确！</h4>
            <p class="mb-0">继续加油！</p>
        </div>
    {% else %}
        <div class="alert alert-danger">
            <h4 class="alert-heading">❌ 错误</h4>
            <p class="mb-0">你的答案：{{ user_input }}</p>
            <p class="mb-0">正确答案：<strong>{{ correct_answer }}</strong></p>
            <p class="mb-0 text-muted small">该单词已加入复习队列</p>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('answer') }}">
        <input type="hidden" name="word_id" value="{{ word_id }}">
        <input type="hidden" name="answer" value="{% if correct %}{{ user_input }}{% else %}{{ correct_answer }}{% endif %}">
        <input type="hidden" name="is_review" value="{{ is_review }}">

        <button type="submit" class="btn btn-primary w-100 mb-3">继续下一个 →</button>
    </form>

    <p class="text-muted small">💡 提示：答错后，系统会自动用正确答案帮您订正并进入下一题</p>
</div>

<script>
    // 自动提交表单
    setTimeout(function() {
        document.querySelector('form').submit();
    }, 1000);
</script>
{% endblock %}
